[project]
name = "yt-w"
version = "1.0.0"
description = "YouTube Live Stream Monitor and Downloader"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.1",
    "yt-dlp>=2026.7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
